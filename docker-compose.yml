services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/astronomy_hub
      REDIS_URL: redis://redis:6379/0
      SATELLITE_TLE_FEED_PATH: /runtime/oras-satellite-tle/tle_satellite.jsonl.gz
      ORAS_SATELLITE_TLE_MANIFEST_PATH: /runtime/oras-satellite-tle/manifest.json
      ORAS_CATALOG_PACKS_DIR: /runtime/oras-catalog-packs
      ORAS_PLANETARY_EPHEMERIS_DIR: /runtime/oras-planetary-ephemeris
    ports:
      - "8000:8000"
    volumes:
      - ./frontend/public/oras-sky-engine/skydata:/runtime/oras-sky-engine/skydata:ro
      - ${ORAS_SATELLITE_TLE_HOST_DIR:-./frontend/public/oras-sky-engine/skydata}:/runtime/oras-satellite-tle:ro
      - ${ORAS_CATALOG_PACKS_HOST_DIR:-./data/runtime-packs/catalog-packs}:/runtime/oras-catalog-packs:ro
      - ${ORAS_PLANETARY_EPHEMERIS_HOST_DIR:-./data/runtime-packs/planetary-ephemeris/release}:/runtime/oras-planetary-ephemeris:ro
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend/public/oras-sky-engine/skydata:/app/public/oras-sky-engine/skydata:ro
      - ${ORAS_SATELLITE_TLE_HOST_DIR:-./frontend/public/oras-sky-engine/skydata}/tle_satellite.jsonl.gz:/app/public/oras-sky-engine/skydata/tle_satellite.jsonl.gz:ro
      - ${ORAS_CATALOG_PACKS_HOST_DIR:-./data/runtime-packs/catalog-packs}:/app/public/oras-sky-engine/skydata/catalog-packs:ro
      - ${ORAS_DENSE_STAR_TILES_HOST_DIR:-./data/runtime-packs/dense-star-tiles}:/app/public/oras-sky-engine/skydata/dense-star-tiles:ro
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      FRONTEND_PORT: ${FRONTEND_PORT:-4173}
      VITE_DEV_PROXY_TARGET: http://backend:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-4173}:${FRONTEND_PORT:-4173}"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http=require('http');http.get('http://127.0.0.1:'+(process.env.FRONTEND_PORT||4173),res=>process.exit(res.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 5

  stellarium-reference:
    build:
      context: ./vendor/stellarium-web-engine/apps/web-frontend
      dockerfile: Dockerfile
    command: >-
      sh -lc "node -e \"const fs=require('fs');const path='/app/package.json';const pkg=JSON.parse(fs.readFileSync(path,'utf8'));pkg.dependencies=pkg.dependencies||{};pkg.devDependencies=pkg.devDependencies||{};pkg.dependencies.vue='2.6.12';pkg.devDependencies['vue-template-compiler']='2.6.12';fs.writeFileSync(path, JSON.stringify(pkg, null, 2)+'\\n');\" && yarn install && ./node_modules/.bin/vue-cli-service serve --host 0.0.0.0 --port 8080"
    ports:
      - "8080:8080"
      - "8888:8888"
    volumes:
      - ./vendor/stellarium-web-engine/apps/web-frontend:/app
      - ./vendor/stellarium-web-engine/apps/test-skydata:/skydata
      - ./vendor/stellarium-web-engine/apps/test-skydata:/test-skydata
      - stellarium_reference_node_modules:/app/node_modules
    user: "0:0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http=require('http');http.get('http://127.0.0.1:8080',res=>process.exit(res.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 10

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: astronomy_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15433:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  stellarium_reference_node_modules:
