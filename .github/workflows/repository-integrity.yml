name: Repository integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [recovery/reconcile-20261026]

permissions:
  contents: read

concurrency:
  group: repository-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Repository source checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read qualified Earth source pin
        id: earth-pin
        run: |
          python3 - <<'PY'
          import json, os
          lock = json.load(open('integrations/renderers.lock.json'))['earth']
          assert lock['upstream'] == 'https://github.com/bilawalsidhu/gods-eye-view'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('sha=' + lock['sha'], file=output)
          PY
      - name: Fetch immutable Earth source for contract tests
        uses: actions/checkout@v4
        with:
          repository: bilawalsidhu/gods-eye-view
          ref: ${{ steps.earth-pin.outputs.sha }}
          path: .ci/gods-eye
          persist-credentials: false
      - name: Verify Earth source pin
        run: test "$(git -C .ci/gods-eye rev-parse HEAD)" = '${{ steps.earth-pin.outputs.sha }}'
      - name: Runtime and science contracts
        env:
          GODS_EYE_SOURCE: ${{ github.workspace }}/.ci/gods-eye
        run: node --test tests/runtime/*.test.mjs tests/earth/*.test.mjs tests/planet/*.test.mjs tests/runtime-protocol/*.test.mjs
      - name: Satellite source admission fixtures
        run: python3 -m unittest discover -s tests/runtime -p test_native_satellite_source_stage.py -v
      - name: Install root validation dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Hub dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Hub tests, types and build
        working-directory: frontend
        run: |
          npm test -- --run
          npm run typecheck
          npm run build -- --outDir ../output/ci/hub
      # These source checks do not certify Docker, external datasets, native
      # reconstruction, deployed source offers, browser pixels or owner UX.
      # Those remain explicit release gates in the recovery manifest.
