services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/astronomy_hub
      REDIS_URL: redis://redis:6379/0
      SATELLITE_TLE_FEED_PATH: /runtime/oras-satellite-tle/tle_satellite.jsonl.gz
      ORAS_SATELLITE_TLE_MANIFEST_PATH: /runtime/oras-satellite-tle/manifest.json
      ORAS_CATALOG_PACKS_DIR: /runtime/oras-catalog-packs
      ORAS_PLANETARY_EPHEMERIS_DIR: /runtime/oras-planetary-ephemeris
    volumes:
      - ./frontend/public/oras-sky-engine/skydata:/runtime/oras-sky-engine/skydata:ro
      - ${ORAS_SATELLITE_TLE_HOST_DIR:-./frontend/public/oras-sky-engine/skydata}:/runtime/oras-satellite-tle:ro
      - ${ORAS_CATALOG_PACKS_HOST_DIR:-./data/runtime-packs/catalog-packs}:/runtime/oras-catalog-packs:ro
      - ${ORAS_PLANETARY_EPHEMERIS_HOST_DIR:-./data/runtime-packs/planetary-ephemeris/release}:/runtime/oras-planetary-ephemeris:ro
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "${PUBLIC_HTTP_PORT:-4173}:80"
    volumes:
      - ./frontend/public/oras-sky-engine/skydata:/usr/share/nginx/html/oras-sky-engine/skydata:ro
      - ${ORAS_SATELLITE_TLE_HOST_DIR:-./frontend/public/oras-sky-engine/skydata}/tle_satellite.jsonl.gz:/usr/share/nginx/html/oras-sky-engine/skydata/tle_satellite.jsonl.gz:ro
      - ${ORAS_CATALOG_PACKS_HOST_DIR:-./data/runtime-packs/catalog-packs}:/usr/share/nginx/html/oras-sky-engine/skydata/catalog-packs:ro
      - ${ORAS_DENSE_STAR_TILES_HOST_DIR:-./data/runtime-packs/dense-star-tiles}:/usr/share/nginx/html/oras-sky-engine/skydata/dense-star-tiles:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -s /usr/share/nginx/html/oras-sky-engine/skydata/tle_satellite.jsonl.gz &&
          test -s /usr/share/nginx/html/oras-sky-engine/skydata/packs/base/dso/properties
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: astronomy_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
